[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bdd-orchestrator"
version = "0.1.0"
description = "Step-level orchestration and manual recovery for BDD workflows using pytest"
readme = "README.md"
authors = [
  { name="Jitendra Singh" }
]
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
  "pytest>=7.0",
  "pytest-bdd>=7.0"
]

classifiers = [
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://github.com/jit3pam/bdd-orchestrator"
Issues = "https://github.com/jit3pam/bdd-orchestrator/issues"
Repository = "https://github.com/jit3pam/bdd-orchestrator"