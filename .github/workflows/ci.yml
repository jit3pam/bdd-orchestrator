name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e . pytest pytest-bdd

      - name: Prepare report directories
        run: mkdir -p reports/cucumber

      - name: Run tests
        run: pytest -v --cucumberjson=reports/cucumber/${{ github.run_id }}.json

      - name: Ensure cucumber JSON exists
        if: always()
        run: |
          if [ ! -s reports/cucumber/${{ github.run_id }}.json ]; then
            echo "[]" > reports/cucumber/${{ github.run_id }}.json
          fi

      - name: Checkout or create cucumber_results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --heads origin cucumber_results | grep -q cucumber_results; then
            git checkout cucumber_results
          else
            git checkout -b cucumber_results
          fi

      - name: Add and commit cucumber results
        run: |
          git add -f reports/cucumber/${{ github.run_id }}.json || true
          git commit -m "Add cucumber results for run $GITHUB_RUN_ID" || echo "No changes to commit"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push origin HEAD:cucumber_results || true
