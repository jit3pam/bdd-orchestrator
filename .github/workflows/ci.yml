name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e . pytest pytest-bdd

      - name: Prepare report directories
        run: mkdir -p reports/cucumber

      - name: Run tests
        run: pytest -v --cucumberjson=reports/cucumber/results.json

      - name: Ensure cucumber JSON exists and debug
        if: always()
        run: |
          mkdir -p reports/cucumber
          if [ ! -s reports/cucumber/results.json ]; then
            echo "[]" > reports/cucumber/results.json
            echo "Created empty results.json"
          fi
          echo "results.json size: $(stat -c%s reports/cucumber/results.json || echo 0)"
          ls -la reports/cucumber || true
          cat reports/cucumber/results.json || true

      - name: Upload Cucumber JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber
          path: reports/cucumber/results.json
          retention-days: 30

      - name: Debug show report directory
        if: always()
        run: |
          echo "-- ls reports/cucumber --"
          ls -la reports/cucumber || true

      - name: Debug list artifacts for this run
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "Listing artifacts for run $RUN_ID in $REPO"
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts" | python -m json.tool || true
