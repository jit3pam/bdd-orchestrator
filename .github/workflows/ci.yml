name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e . pytest pytest-bdd

      - name: Prepare report directories
        run: mkdir -p reports/cucumber

      - name: Run tests
        run: pytest -v --cucumberjson=reports/cucumber/results.json
      - name: Upload Cucumber JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber
          path: reports/cucumber/results.json
          retention-days: 30
