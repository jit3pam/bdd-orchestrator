name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e . pytest pytest-bdd
      - name: Run tests
        run: pytest -v --cucumberjson=reports/cucumber/results.json
      - name: Upload Cucumber JSON
        uses: actions/upload-artifact@v4
        with:
          name: cucumber
          path: reports/cucumber/
