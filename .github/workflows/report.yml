name: Publish Cucumber HTML Report

permissions:
  contents: read
  actions: read
  pages: write

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cucumber_results branch
        uses: actions/checkout@v4
        with:
          ref: cucumber_results
          fetch-depth: 0

      - name: Ensure reports/cucumber has files
        run: |
          if [ ! -d reports/cucumber ] || [ -z "$(ls -A reports/cucumber 2>/dev/null)" ]; then
            echo "No cucumber files found in branch cucumber_results"
            ls -la || true
            exit 1
          fi
          ls -la reports/cucumber

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install reporter
        run: npm install multiple-cucumber-html-reporter

      - name: Generate HTML report
        run: node generate_report.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/html
